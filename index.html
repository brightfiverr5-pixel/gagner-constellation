<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEDY GAGNÉ – Outils</title>
<style>

</style></head><body><div class="app"><header><a href="#">←</a><b id="t">FEDY GAGNÉ</b></header><main id="v"></main><div id="pp"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=i=>document.getElementById(i),V=$('v');
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem('fg_'+k))||d}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem('fg_'+k,JSON.stringify(v))}catch(e){}};
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CC=()=>L('pays',{c:'Togo',u:'XOF',r:''}).u,CN=c=>c=='XOF'||c=='XAF'?'FCFA':c,cur=()=>L('cur',CN(CC())),M=n=>Number(n||0).toLocaleString('fr-FR')+' '+cur();
const val=i=>$(i).value.trim(),today=()=>new Date().toISOString().slice(0,10),pr=()=>window.print();
function cp(id){const e=$(id);e.select();try{navigator.clipboard.writeText(e.value)}catch(_){document.execCommand('copy')}alert('Copié.')}
function printTxt(txt){$('pp').textContent=txt;$('pp').className='pr';pr();$('pp').className=''}
/* Comptabilité */
function compta(){let o=L('ops',[]),r=0,d=0;o.forEach(x=>x.t=='r'?r+=x.m:d+=x.m);
V.innerHTML=`<h2>Recettes et dépenses</h2><div class=bx><b>Solde : ${M(r-d)}</b><br><small>Recettes ${M(r)} · Dépenses ${M(d)}</small></div>
<div class=f><select id=ot><option value=r>Recette</option><option value=d>Dépense</option></select><input id=ol placeholder="Libellé"><input id=om type=number placeholder="Montant">${PH('orf','Photo du reçu (facultatif)')}<button onclick="addOp()">Ajouter</button></div>
${o.map((x,i)=>`<div class=it><span>${x.ph?`<img src="${x.ph}" width=40 style="border-radius:6px;vertical-align:middle"> `:''}${E(x.d)} · ${E(x.l)}</span><b class="${x.t}">${x.t=='r'?'+':'-'}${M(x.m)}</b><button class=x onclick="delOp(${i})">✕</button></div>`).join('')||'<p class=em>Aucune opération pour le moment.</p>'}
<h2>Facture</h2><div class=f><input id=en placeholder="Votre entreprise" value="${E(L('ent',''))}"><input id=cl placeholder="Nom du client"><textarea id=li placeholder="Une ligne par article : désignation;quantité;prix&#10;Exemple : Service;2;5000"></textarea><input id=tv type=number placeholder="TVA % (facultatif)"><input id=dv placeholder="Devise" value="${E(cur())}"><button onclick="fact()">Créer la facture</button></div><div id=fa></div>`}
async function addOp(){const m=parseFloat(val('om')),l=val('ol');if(!l||!(m>0))return alert('Écrivez un libellé et un montant.');const ph=await thumb($('orf').files[0]),o=L('ops',[]);o.unshift({d:today(),t:val('ot'),l,m,ph});W('ops',o);compta()}
function delOp(i){const o=L('ops',[]);o.splice(i,1);W('ops',o);compta()}
function fact(){W('ent',val('en'));W('cur',val('dv')||'FCFA');const rows=val('li').split('\n').map(s=>s.split(';')).filter(a=>a[0]&&a[0].trim()),tv=parseFloat(val('tv'))||0;if(!rows.length)return alert('Ajoutez au moins une ligne.');let h=0;const tr=rows.map(a=>{const q=parseFloat(a[1])||1,p=parseFloat(a[2])||0;h+=q*p;return`<tr><td>${E(a[0])}</td><td>${q}</td><td>${M(p)}</td><td>${M(q*p)}</td></tr>`}).join('');const n=L('nf',0)+1;W('nf',n);
$('fa').innerHTML=`<div class=pr id=fp><h3>FACTURE N° ${String(n).padStart(4,'0')}</h3><p>${E(val('en'))}<br>Date : ${today()}<br>Client : ${E(val('cl'))}</p><table><tr><th>Désignation</th><th>Qté</th><th>Prix</th><th>Total</th></tr>${tr}</table><p>Total HT : ${M(h)}${tv?`<br>TVA ${tv}% : ${M(h*tv/100)}`:''}<br><b>Total à payer : ${M(h*(1+tv/100))}</b></p></div><button onclick="pr()">Imprimer / Enregistrer en PDF</button>`}
/* Organisation : tâches avec date, heure et alarme */
const fmtD=d=>!d?'':d.includes('T')?new Date(d).toLocaleString('fr-FR',{dateStyle:'full',timeStyle:'short'}):new Date(d+'T00:00').toLocaleDateString('fr-FR',{dateStyle:'full'});
let AC=null,AL=null;document.addEventListener('click',()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()});
function orga(){const t=L('tk',[]);V.innerHTML=`<h2>Mes tâches et rendez-vous</h2><div class=bx><small>Choisissez la date et l’heure : une alarme sonne à l’heure, tant que l’application est ouverte. Pour être prévenu même application fermée, touchez « Agenda » : la tâche est ajoutée à l’agenda de votre téléphone avec son alarme.</small></div><div class=f><input id=tt placeholder="Nouvelle tâche (ex : réunion avec le client)"><input id=td type=datetime-local><button onclick="addT()">Ajouter</button></div>${t.map((x,i)=>`<div class=it style="flex-wrap:wrap"><input type=checkbox style="width:22px" ${x.x?'checked':''} onchange="tgT(${i})"><span class="${x.x?'dn':''}"><b>${E(x.t)}</b>${x.d?'<br><small>'+E(fmtD(x.d))+'</small>':''}</span><button class=x onclick="delT(${i})">✕</button>${x.d&&x.d.includes('T')&&!x.x?`<a class=bt href="#" onclick="return icsT(${i})">⏰ Agenda + alarme</a><a class=bt target=_blank href="${gcal(x)}">Google Agenda</a>`:''}</div>`).join('')||'<p class=em>Aucune tâche. Ajoutez la première.</p>'}<p class=em>${t.filter(x=>!x.x).length} à faire · ${t.filter(x=>x.x).length} terminée(s)</p>`}
function addT(){const x=val('tt');if(!x)return;const t=L('tk',[]);t.push({t:x,d:$('td').value,x:0,a:0});t.sort((a,b)=>(a.d||'9')>(b.d||'9')?1:-1);W('tk',t);orga()}
function tgT(i){const t=L('tk',[]);t[i].x=t[i].x?0:1;W('tk',t);orga()}
function delT(i){const t=L('tk',[]);t.splice(i,1);W('tk',t);orga()}
const l2=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'};
function gcal(x){const s=new Date(x.d);return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.t)+'&dates='+l2(s)+'/'+l2(new Date(s.getTime()+36e5))}
function icsT(i){const x=L('tk',[])[i],s=new Date(x.d),u=new Date(),z=u.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',c=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FEDY GAGNE//FR','BEGIN:VEVENT','UID:'+Date.now()+'@fedy-gagne','DTSTAMP:'+z,'DTSTART:'+l2(s),'DTEND:'+l2(new Date(s.getTime()+36e5)),'SUMMARY:'+x.t.replace(/[,;\n]/g,' '),'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+x.t.replace(/[,;\n]/g,' '),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/calendar'}));a.download='tache.ics';a.click();return false}
function chkAl(){if(AL)return;const t=L('tk',[]),n=Date.now();for(let i=0;i<t.length;i++){const x=t[i];if(x.x||x.a||!x.d||!x.d.includes('T'))continue;const d=new Date(x.d).getTime();if(d<=n){t[i].a=1;W('tk',t);ring(x);return}}}
function ring(x){AL={int:null};const o=document.createElement('div');o.id='alov';o.style.cssText='position:fixed;inset:0;background:#b00020;color:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center';o.innerHTML=`<div style="font-size:64px">⏰</div><div style="font-size:26px;font-weight:bold">${E(x.t)}</div><div>${E(fmtD(x.d))}</div><button style="font-size:22px;padding:18px 40px;width:auto;margin-top:12px" onclick="alOff()">Éteindre</button>`;document.body.appendChild(o);
const beep=()=>{try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const a=AC.createOscillator(),g=AC.createGain();a.frequency.value=880;g.gain.value=.35;a.connect(g);g.connect(AC.destination);a.start();a.stop(AC.currentTime+.4)}catch(e){}if(navigator.vibrate)navigator.vibrate([300,150,300])};beep();AL.int=setInterval(beep,1000)}
function alOff(){if(AL)clearInterval(AL.int);const o=document.getElementById('alov');if(o)o.remove();AL=null;if($('v')&&location.hash=='#orga')orga()}
/* Commerce */
function commerce(){const c=L('cl',[]),v=L('vt',[]),tot=v.reduce((s,x)=>s+x.m,0);V.innerHTML=`<h2>Clients</h2><div class=f><input id=cn placeholder="Nom du client"><input id=cp type=tel placeholder="Téléphone avec indicatif, ex : 22890000000"><button onclick="addC()">Ajouter</button></div>${c.map((x,i)=>`<div class=it><span>${E(x.n)}<br><small>${E(x.p)}</small></span>${x.p?`<a class=bt href="https://wa.me/${x.p.replace(/\D/g,'')}?text=${encodeURIComponent('Bonjour '+x.n+',')}" target=_blank>WhatsApp</a>`:''}<button class=x onclick="delC(${i})">✕</button></div>`).join('')||'<p class=em>Aucun client enregistré.</p>'}
<h2>Ventes</h2><div class=bx><b>Total des ventes : ${M(tot)}</b></div><div class=f><select id=vc>${c.map(x=>`<option>${E(x.n)}</option>`).join('')||'<option>Client divers</option>'}</select><input id=vp placeholder="Produit ou service"><input id=vm type=number placeholder="Montant">${PH('vpf','Photo du produit (facultatif)')}<button onclick="addV()">Enregistrer la vente</button></div>${v.map((x,i)=>`<div class=it><span>${x.ph?`<img src="${x.ph}" width=40 style="border-radius:6px;vertical-align:middle"> `:''}${E(x.d)} · ${E(x.c)}<br><small>${E(x.p)}</small></span><b>${M(x.m)}</b><button class=x onclick="delV(${i})">✕</button></div>`).join('')}`}
function addC(){const n=val('cn');if(!n)return;const c=L('cl',[]);c.push({n,p:val('cp')});W('cl',c);commerce()}
function delC(i){const c=L('cl',[]);c.splice(i,1);W('cl',c);commerce()}
async function addV(){const m=parseFloat(val('vm'));if(!(m>0))return alert('Écrivez un montant.');const ph=await thumb($('vpf').files[0]),v=L('vt',[]);v.unshift({d:today(),c:val('vc'),p:val('vp'),m,ph});W('vt',v);commerce()}
function delV(i){const v=L('vt',[]);v.splice(i,1);W('vt',v);commerce()}
/* Secrétariat */
const TP={cand:['Candidature','Poste visé',f=>`Objet : Candidature au poste de ${f.o}\n\nMadame, Monsieur,\n\nJe vous adresse ma candidature pour le poste de ${f.o}. Motivé(e) et sérieux(se), je souhaite mettre mes compétences au service de votre structure.\n\nJe reste à votre disposition pour un entretien et vous prie d’agréer, Madame, Monsieur, mes salutations distinguées.`],
dem:['Démission','Poste occupé',f=>`Objet : Démission\n\nMadame, Monsieur,\n\nJe vous informe de ma décision de démissionner de mon poste de ${f.o}. Je respecterai le préavis prévu et reste disponible pour assurer la passation de mes dossiers.\n\nVeuillez agréer, Madame, Monsieur, mes salutations distinguées.`],
conge:['Demande de congé','Période (ex : du 1er au 15 décembre)',f=>`Objet : Demande de congé\n\nMadame, Monsieur,\n\nJe sollicite un congé pour la période suivante : ${f.o}. Je m’engage à organiser la continuité de mon travail avant mon départ.\n\nDans l’attente de votre réponse, veuillez agréer, Madame, Monsieur, mes salutations distinguées.`],
recl:['Réclamation','Sujet de la réclamation',f=>`Objet : Réclamation – ${f.o}\n\nMadame, Monsieur,\n\nJe vous écris au sujet de la situation suivante : ${f.o}. Je vous demande de bien vouloir examiner ce dossier et de me répondre dans les meilleurs délais.\n\nVeuillez agréer, Madame, Monsieur, mes salutations distinguées.`]};
function secr(){V.innerHTML=`<h2>Lire une lettre ou un document</h2><div class=f><label class=bt>📷 Photo ou galerie<input type=file accept="image/*" hidden onchange="lirL(this)"></label></div><div id=ll></div><h2>Lettres professionnelles</h2><div class=f><select id=sk onchange="$('so').placeholder=TP[this.value][1]">${Object.keys(TP).map(k=>`<option value=${k}>${TP[k][0]}</option>`).join('')}</select><input id=sn placeholder="Votre nom complet"><input id=sv placeholder="Votre ville"><input id=sr placeholder="Destinataire (ex : Monsieur le Directeur)"><input id=so placeholder="${TP.cand[1]}"><button onclick="mkL()">Rédiger la lettre</button></div><div id=sl></div>`}
function mkL(){const k=val('sk'),f={n:val('sn'),v:val('sv'),r:val('sr'),o:val('so')};if(!f.n||!f.o)return alert('Écrivez votre nom et le champ du bas.');
$('sl').innerHTML=`<h2>Votre lettre</h2><textarea id=lt rows=16>${E(`${f.n}\n${f.v}, le ${new Date().toLocaleDateString('fr-FR')}\n\nÀ l’attention de ${f.r||'Monsieur, Madame'}\n\n`+TP[k][2](f)+`\n\n${f.n}`)}</textarea><button onclick="cp('lt')">Copier</button><button onclick="printTxt($('lt').value)">Imprimer / Enregistrer en PDF</button><button onclick="window.open('https://wa.me/?text='+encodeURIComponent($('lt').value))">Envoyer par WhatsApp</button>`}
/* Traduction */
function trad(){V.innerHTML=`<h2>Traduction</h2><div class=f><label class=bt>📷 Photographier un texte ou un test<input type=file accept="image/*" capture="environment" hidden onchange="trOcr(this)"></label><label class=bt>🖼️ Choisir dans la galerie<input type=file accept="image/*" hidden onchange="trOcr(this)"></label><select id=tf>${LO}</select><select id=tl>${LO.replace('value=en','value=en selected')}</select><textarea id=ti rows=6 placeholder="Écrivez, collez ou scannez le texte à traduire"></textarea><button onclick="doT()">Traduire</button></div><p id=ts class=em></p><textarea id=to rows=8 readonly placeholder="La traduction apparaît ici"></textarea><button onclick="cp('to')">Copier</button><button onclick="printTxt($('to').value)">Enregistrer en PDF</button><button onclick="shT()">Partager</button><p class=em>Service gratuit MyMemory, limité chaque jour.</p>`}
async function trOcr(i){const f=i.files[0];i.value='';if(!f)return;try{$('ts').textContent='Lecture du texte…';$('ti').value=(await ocr(f,val('tf'),$('ts'))).trim();$('ts').textContent='Texte lu ✓ Vérifiez-le, puis touchez Traduire.'}catch(e){$('ts').textContent='Lecture impossible. Vérifiez la connexion internet et la langue du texte.'}}
async function doT(){const q=val('ti');if(!q)return;if(val('tf')==val('tl'))return alert('Choisissez deux langues différentes.');let ch=[],cur='';for(const s of (q.match(/[^.!?\n]+[.!?\n]*/g)||[q])){if((cur+s).length>420&&cur){ch.push(cur);cur=''}cur+=s}if(cur)ch.push(cur);ch=ch.flatMap(x=>x.length>440?x.match(/[\s\S]{1,420}/g):[x]);let out='';
try{for(let k=0;k<ch.length;k++){$('ts').textContent='Traduction '+(k+1)+' sur '+ch.length+'…';const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(ch[k])+'&langpair='+val('tf')+'|'+val('tl')),j=await r.json();if(j.responseStatus!=200&&j.responseStatus!='200')throw new Error('q');out+=j.responseData.translatedText+' ';$('to').value=out.trim()}$('ts').textContent='Traduction terminée ✓'}catch(e){$('ts').textContent=out?'Limite du service gratuit atteinte : traduction partielle. Réessayez plus tard.':'Impossible de traduire pour le moment. Vérifiez la connexion ou réessayez plus tard.'}}
function shT(){const t=$('to').value;if(!t)return;if(navigator.share)navigator.share({text:t}).catch(()=>{});else cp('to')}
/* Lecture de texte sur photo (OCR) */
const LN={fr:'Français',en:'Anglais',es:'Espagnol',pt:'Portugais',de:'Allemand',ar:'Arabe'},LM={fr:'fra',en:'eng',es:'spa',pt:'por',de:'deu',ar:'ara'};
const LO=Object.keys(LN).map(c=>`<option value=${c}>${LN[c]}</option>`).join('');
function loadT(){return window.Tesseract?Promise.resolve():new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=r;s.onerror=()=>j(new Error('load'));document.head.appendChild(s)})}
async function ocr(file,lang,st){await loadT();const w=await Tesseract.createWorker(LM[lang]||'fra',1,{logger:m=>{if(st&&m.status)st.textContent='Lecture : '+m.status+(m.progress?' '+Math.round(m.progress*100)+' %':'')}});try{const r=await w.recognize(file);return r.data.text}finally{await w.terminate()}}
const OCRUI='<h2>Texte du document</h2><button onclick="scOcr()">📝 Extraire le texte de ces pages</button><p id=os class=em></p><textarea id=oc rows=8 placeholder="Le texte lu apparaît ici"></textarea><button onclick="cp(\'oc\')">Copier le texte</button><button onclick="printTxt($(\'oc\').value)">Texte en PDF</button>';
async function scOcr(){if(!SC.length)return alert('Ajoutez au moins une image.');let t='';try{for(let i=0;i<SC.length;i++){$('os').textContent='Page '+(i+1)+' sur '+SC.length+'…';t+=(SC.length>1?'--- Page '+(i+1)+' ---\n':'')+(await ocr(SC[i],val('sg'),$('os'))).trim()+'\n\n'}$('oc').value=t.trim();$('os').textContent='Texte lu ✓ Relisez-le avant de l’utiliser.'}catch(e){$('os').textContent='Lecture impossible. Vérifiez la connexion internet et réessayez.'}}
/* Documents : scanner et images en PDF, texte en PDF */
let SC=[],OUT=[];
function docs(){V.innerHTML=`<h2>Scanner et images en PDF</h2><div class=f>
<label class=bt>📷 Prendre une photo<input type=file accept="image/*" capture="environment" hidden onchange="addF(this)"></label>
<button onclick="camOn()">🎥 Caméra en direct (plusieurs pages d’affilée)</button><div id=cam></div>
<label class=bt>🖼️ Choisir des images (plusieurs à la fois)<input type=file accept="image/*" multiple hidden onchange="addF(this)"></label>
<div id=sl></div>
<select id=so1><option value=1>Un seul PDF avec toutes les pages</option><option value=n>Un PDF par image</option></select>
<select id=sf><option value=a>Pages A4</option><option value=i>Taille de l’image</option></select>
<select id=sm><option value=d>Document (contraste net)</option><option value=g>Niveaux de gris</option><option value=c>Couleur</option></select>
<select id=sq><option value=.85>Qualité haute</option><option value=.65>Qualité moyenne</option><option value=.45>Fichier léger</option></select>
<select id=sg>${LO}</select><input id=sn placeholder="Nom du PDF (facultatif)"><button onclick="mkScan()">Créer le PDF</button></div><div id=sr></div>
<p class=em>Pour un très grand nombre d’images, traitez-les par groupes de 100 pour ne pas saturer le téléphone.</p>

function nbr(t,re){let c=0,m;const rx=new RegExp('(\\d+|une?|deux|trois|quatre|cinq|six|sept|huit|neuf|dix)\\s+(?:grandes?\\s+|petites?\\s+)?'+re,'g');while((m=rx.exec(t)))c+=NB2[m[1]]||+m[1]||1;if(!c&&new RegExp(re).test(t))c=1;return c}
const DDK={elec:['Électricité','Ex : 8 lampes, 12 prises, 5 interrupteurs, 1 climatiseur, 1 chauffe-eau',t=>{const a=nbr(t,'(?:lampes?|ampoules?|points? lumineux|spots?|luminaires?)'),p=nbr(t,'prises?'),i=nbr(t,'(?:interrupteurs?|va-et-vient)'),c=nbr(t,'(?:climatiseurs?|clim)'),e=nbr(t,'chauffe-eau'),m15=(a+i)*8,m25=p*10+e*10,m4=c*12;return[['Points lumineux',a,'pièces'],['Prises',p,'pièces'],['Interrupteurs',i,'pièces'],['Climatiseur (ligne dédiée)',c,'lignes'],['Chauffe-eau (ligne dédiée)',e,'lignes'],['Boîtes d’encastrement',a+p+i,'pièces'],['Câble 1,5 mm²',m15,'m'],['Câble 2,5 mm²',m25,'m'],['Câble 4 mm² (climatiseur)',m4,'m'],['Gaine ICTA',Math.ceil((m15+m25+m4)/3),'m'],['Disjoncteurs',Math.ceil(p/8)+Math.ceil(a/10)+c+e,'pièces'],['Disjoncteur différentiel 30 mA',1,'pièce'],['Tableau électrique',1,'pièce']].filter(x=>x[1]>0)}],
plomb:['Plomberie','Ex : 2 douches, 3 lavabos, 2 WC, 1 évier, 1 chauffe-eau, arrivée d’eau à 10 m',t=>{const d=nbr(t,'douches?'),l=nbr(t,'lavabos?'),w=nbr(t,'(?:wc|toilettes?)'),e=nbr(t,'[ée]viers?'),c=nbr(t,'chauffe-eau'),m=nbr(t,'machines? [àa] laver'),dm=t.match(/(\d+)\s*m(?:[eè]tres?)?\s*(?:de distance|d.arriv[ée]e|de l.arriv[ée]e)?/),di=dm?+dm[1]:6,P=d+l+w+e+m;return[['Points d’eau',P,'points'],['Tuyau d’alimentation PER/PVC',Math.ceil(P*di*1.1),'m'],['Tuyau d’évacuation PVC',(d+l+e+m)*3+w*4,'m'],['Raccords',P*4,'pièces'],['Robinets d’arrêt',P,'pièces'],['Siphons',d+l+e,'pièces'],['Flexibles',l+e+w,'pièces'],['Chauffe-eau',c,'pièce'],['Colle PVC',Math.ceil(P/6),'tubes']].filter(x=>x[1]>0)}],
bat:['Bâtiment (gros œuvre)','Ex : maison de 10 m sur 8 m, 5 pièces, hauteur 2,7 m, 3 portes, 6 fenêtres',t=>{const d=t.match(/(\d+(?:[.,]\d+)?)\s*(?:m|mètres?)?\s*(?:x|×|par|sur)\s*(\d+(?:[.,]\d+)?)/),W=d?+d[1].replace(',','.'):10,D=d?+d[2].replace(',','.'):8,hm=t.match(/(?:hauteur|haut)\s*(?:de)?\s*(\d+(?:[.,]\d+)?)/),h=hm?+hm[1].replace(',','.'):2.7,pc=nbr(t,'pi[èe]ces?')||5,po=nbr(t,'portes?'),fe=nbr(t,'fen[êe]tres?'),L=2*(W+D)+(pc-1)*Math.min(W,D)*.9,lt=a=>a.filter(x=>!['Surface du mur','Surface','Béton total'].includes(x[0]));return lt([...CH.murs[2]({L,h,o:po*2+fe*1.5}),...CH.beton[2]({L:W,l:D,e:12}).map(x=>['Dalle : '+x[0],x[1],x[2]]),...CH.carr[2]({L:W,l:D,c:40}),...CH.peint[2]({s:Math.round(L*h*1.6),n:2})])}]};
let DK={k:'elec',l:[]};
function devisd(){V.innerHTML=`<h2>Devis par description</h2><div class=bx><small>Écrivez ce que vous voulez : le devis sort avec les quantités (câbles, tuyaux, matériaux). Quantités estimées, à faire valider par un professionnel.</small></div><div class=f><select id=dk onchange="dkEx()">${Object.keys(DDK).map(k=>`<option value=${k}>${DDK[k][0]}</option>`).join('')}</select><textarea id=dtx rows=5></textarea><button onclick="dkMake()">Établir le devis</button></div><div id=dkz></div>`;dkEx()}
function dkEx(){$('dtx').placeholder=DDK[val('dk')][1]}
function dkMake(){const k=val('dk'),t=val('dtx').toLowerCase();if(!t)return alert('Écrivez ce que vous voulez.');DK={k,l:DDK[k][2](t)};if(!DK.l.length)return alert('Je n’ai rien reconnu. Suivez l’exemple écrit dans la case.');$('dkz').innerHTML=`<h2>Prix unitaires</h2>${DK.l.map(([n,q,u])=>`<div class=it><span>${E(n)}<br><small>${q} ${E(u)}</small></span><input type=number step=any style="width:110px" placeholder="Prix unitaire" data-k="${E('dd_'+k+'|'+n)}" value="${L('pu',{})['dd_'+k+'|'+n]||''}" oninput="luSet2(this)"></div>`).join('')}<div class=pr id=dkp></div><button onclick="pr()">🖨️ Imprimer le devis / Enregistrer en PDF</button>`;dkRender()}
function luSet2(e){const P=L('pu',{});P[e.dataset.k]=parseFloat(e.value)||0;W('pu',P);dkRender()}
function dkRender(){const P=L('pu',{});let g=0;const r=DK.l.map(([n,q,u])=>{const p=P['dd_'+DK.k+'|'+n]||0,v=q*p;g+=v;return`<tr><td>${E(n)}</td><td>${q} ${E(u)}</td><td>${p?M(p):''}</td><td>${p?M(v):''}</td></tr>`}).join('');$('dkp').innerHTML=`<h3>DEVIS : ${DDK[DK.k][0]}</h3><p>Date : ${new Date().toLocaleDateString('fr-FR')}</p><table><tr><th>Désignation</th><th>Quantité</th><th>Prix unitaire</th><th>Total</th></tr>${r}</table><p><b>TOTAL : ${M(g)}</b></p><p><small>Quantités estimées, à faire valider par un professionnel.</small></p>`}

V.innerHTML=`<h2>Inscription travailleur</h2><div class=bx><small>Gratuit. Pays : ${E(p.c)} (<a href="#pays" style="color:var(--or2)">changer</a>). Même une boutique ou un restaurant peut s’inscrire.</small></div><div class=f><select id=im>${MET.map(m=>`<option ${w&&w.job==m[1]?'selected':''}>${m[1]}</option>`).join('')}</select><input id=io placeholder="Autre métier (si vous avez choisi Autre)"><input id=in value="${E(w?w.name:'')}" placeholder="Votre nom ou le nom de votre boutique"><input id=iv value="${E(w?w.city||'':'')}" placeholder="Ville, quartier"><textarea id=ia rows=3 placeholder="Décrivez votre service (facultatif)">${E(w?w.about||'':'')}</textarea><button onclick="inOk()">${w?'Mettre à jour':'S’inscrire gratuitement'}</button>${w?'<button class=x onclick="inDel()">Supprimer mon inscription</button>':''}<button class=x onclick="acOut()">Se déconnecter</button></div>`}).catch(()=>alert('Erreur de connexion. Réessayez.'))}
function inOk(){let j=val('im');if(j=='Autre')j=val('io').trim();const n=val('in').trim();if(!n||!j)return alert('Le nom et le métier sont obligatoires.');
FD.doc('workers/'+FU.uid).set({name:n.slice(0,80),job:j.slice(0,60),country:PC().c,city:val('iv').slice(0,80),about:val('ia').slice(0,300),createdAt:Date.now()}).then(()=>{alert('Inscription enregistrée. Les clients de votre pays peuvent vous trouver.');location.hash='demandes'}).catch(()=>alert('Erreur. Réessayez.'))}
function inDel(){if(confirm('Supprimer votre inscription ?'))FD.doc('workers/'+FU.uid).delete().then(()=>{alert('Inscription supprimée.');route()})}
function cherche(){WK=null;V.innerHTML=`<h2>Rechercher un travailleur</h2><div class=bx><small>Pays : ${E(PC().c)}. Tapez un métier (taxi, maçon, coiffeur…). La recherche coûte ${E(px())} quand le travailleur accepte (gratuit pendant la période de test).</small></div><div class=f><input id=cq list=ml value="${E(CQ)}" placeholder="Métier (ex : taxi)" oninput="cList()"><datalist id=ml>${MET.map(m=>`<option>${m[1]}</option>`).join('')}</datalist></div><div id=cr></div>`;cList()}
function cShow(){const q=val('cq').toLowerCase();CQ=val('cq');const r=WK.filter(w=>!q||(w.job||'').toLowerCase().includes(q));$('cr').innerHTML=r.length?r.map(w=>`<div class=it><span><b>${E(w.name)}</b> · ${E(w.job)}<br><small>${E(w.city||'')}</small>${w.about?`<br><small>${E(w.about)}</small>`:''}</span><button style="width:auto;margin:0" onclick="dem('${w.id}')">Demander</button></div>`).join(''):'<div class=bx><small>Aucun travailleur inscrit pour ce métier dans ce pays.</small></div>'}
function cList(){if(WK)return cShow();if(!FA)return;$('cr').innerHTML='<div class=bx><small>Chargement…</small></div>';
FD.collection('workers').where('country','==',PC().c).get().then(s=>{WK=s.docs.map(d=>({id:d.id,...d.data()}));if($('cr'))cShow()}).catch(()=>{if($('cr'))$('cr').innerHTML='<div class=bx><small>Erreur de chargement.</small></div>'})}
function dem(id){if(!FU)return needAcct('Rechercher un travailleur');const w=(WK||[]).find(x=>x.id==id);if(!w)return;if(id==FU.uid)return alert('C’est votre propre fiche.');
FD.collection('requests').add({clientUid:FU.uid,workerUid:id,workerName:w.name,job:w.job,country:w.country,clientName:FU.displayName||'Un client',status:'pending',paid:false,createdAt:Date.now()}).then(()=>{alert('Demande envoyée à '+w.name+'.');location.hash='demandes'}).catch(()=>alert('Erreur. Réessayez.'))}
function demandes(){UN.forEach(f=>f());UN=[];if(!FA)return;if(!FU)return needAcct('Mes demandes');
V.innerHTML=`<h2>Mes demandes</h2><h2>Reçues (je suis travailleur)</h2><div id=dr></div><h2>Envoyées (je cherche)</h2><div id=ds></div><button class=x onclick="acOut()">Se déconnecter</button>`;
const sh=(f,id,fn)=>UN.push(FD.collection('requests').where(f,'==',FU.uid).onSnapshot(s=>{if(!$(id))return;const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.createdAt-x.createdAt);$(id).innerHTML=a.length?a.map(fn).join(''):'<div class=bx><small>Aucune demande.</small></div>'},()=>{}));
sh('workerUid','dr',r=>`<div class=bx><b>${E(r.clientName||'Un client')}</b> · ${E(r.job)}<br><small>${new Date(r.createdAt).toLocaleDateString('fr-FR')} · ${ST[r.status]}</small>${r.status=='pending'?`<div style="display:flex;gap:8px;margin-top:6px"><button onclick="rep('${r.id}','accepted')" style="flex:1">Accepter</button><button class=x onclick="rep('${r.id}','refused')" style="flex:1">Refuser</button></div>`:''}</div>`);
sh('clientUid','ds',r=>`<div class=bx><b>${E(r.workerName)}</b> · ${E(r.job)}<br><small>${new Date(r.createdAt).toLocaleDateString('fr-FR')} · ${ST[r.status]}</small>${r.status=='accepted'?'<small style="display:block;margin-top:6px;color:var(--or2)">La discussion sera disponible très bientôt.</small>':''}</div>`)}
function rep(id,s){FD.doc('requests/'+id).update({status:s}).catch(()=>alert('Erreur. Réessayez.'))}

const c=SH;V.innerHTML=`<h2>Espace créateur</h2><h2>Prix payé par le client (1 recherche)</h2><div class=f><input id=cp value="${E(c.prix||'')}" placeholder="Vide = 1 € (650 FCFA en Afrique de l’Ouest)"><select id=cpay><option value=0 ${c.paymentsOn?'':'selected'}>Paiements : période gratuite</option><option value=1 ${c.paymentsOn?'selected':''}>Paiements : activés</option></select><h2>Abonnement, accueil et métiers</h2><input id=cm type=number value="${E(c.mp||'')}" placeholder="Prix d’un module par mois en € (vide = 100)"><input id=cs value="${E(c.slogan||'')}" placeholder="Slogan de l’accueil (vide = standard)"><textarea id=cj rows=8 placeholder="Un métier par ligne : emoji, espace, nom">${E(MET.map(m=>m[0]+' '+m[1]).join('\n'))}</textarea><button onclick="crSave()">Enregistrer pour tout le monde</button></div><h2>Mes deux images d’accueil</h2><div class=f><input type=file accept="image/*" onchange="crImg(1,this)"><input type=file accept="image/*" onchange="crImg(2,this)"></div><small>Utilisez vos images décorées, pas vos vraies photos.</small><a class=cd href="#pro">Ma carte professionnelle<small>Ouvrir ›</small></a><button class=x onclick="crOut()" style="margin-top:12px">Se déconnecter</button>`}

function crImg(k,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,300/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=i.width*s;cv.height=i.height*s;cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);crPut({['img'+k]:cv.toDataURL('image/jpeg',.8)},'Image '+k+' enregistrée pour tout le monde.')};i.src=r.result};r.readAsDataURL(f)}
